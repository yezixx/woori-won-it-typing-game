<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typing Game</title>
    <link rel="stylesheet" href="./exam4.css" />
    <script src="./exam4.js" defer></script>
  </head>
  <body>
    <header class="app-bar">
      <div class="app-bar__content">
        <span class="app-bar__mark">80</span>
        <div>
          <p class="app-bar__eyebrow">Practice mode</p>
          <h1>Typing Trainer</h1>
        </div>
      </div>
    </header>

    <main class="game-shell">
      <section class="game-panel" aria-labelledby="game-title">
        <div class="game-heading">
          <div>
            <p class="section-label">Letter sprint</p>
            <h2 id="game-title">다음 문자를 입력하세요</h2>
          </div>
        </div>

        <div class="start-action">
          <button id="startButton" class="button button--primary">
            게임 시작
          </button>
          <div class="player-form">
            <input
              id="playerName"
              name="name"
              type="text"
              maxlength="12"
              placeholder="이름을 입력하세요"
              autocomplete="name"
              aria-label="이름"
            />
            <p id="nameError" class="name-error" aria-live="polite"></p>
          </div>
        </div>

        <div
          id="targetChar"
          aria-live="polite"
          aria-label="입력할 문자"
          hidden
        ></div>

        <p id="gameStatus" class="game-status" aria-live="polite"></p>

        <div class="stats" aria-label="게임 정보">
          <div class="stat-card">
            <span class="stat-card__label">SCORE :</span>
            <strong id="score">0</strong>
          </div>
          <div class="stat-card">
            <span class="stat-card__label">TIME LEFT</span>
            <strong id="timer">20초</strong>
          </div>
          <div class="stat-card">
            <span class="stat-card__label">COMBO</span>
            <strong id="combo">0</strong>
          </div>
          <div class="stat-card">
            <span class="stat-card__label">LEVEL</span>
            <strong id="level">1</strong>
          </div>
        </div>

        <div class="actions">
          <button
            id="resetButton"
            class="button button--text"
            onclick="resetGame()"
          >
            초기화
          </button>
        </div>

        <section class="leaderboard" aria-labelledby="leaderboard-title">
          <div class="leaderboard__heading">
            <h3 id="leaderboard-title">명예의 전당</h3>
            <span>TOP 10</span>
          </div>
          <ol id="leaderboardList" class="leaderboard__list"></ol>
        </section>
      </section>
    </main>
  </body>
</html>
